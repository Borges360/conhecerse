# Prepared only; publish through gitops-publish.ps1. Total application memory limits: 3840 MiB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conhecerse
  namespace: dev
  labels:
    app: conhecerse
    part-of: conhecerse
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: conhecerse
  template:
    metadata:
      labels:
        app: conhecerse
        part-of: conhecerse
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: registry.platform.svc.cluster.local:5000/conhecerse:aguardando-primeiro-build
        ports:
        - name: http
          containerPort: 3000
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        startupProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
        envFrom:
        - secretRef:
            name: conhecerse-web
        env:
        - name: PORT
          value: '3000'
---
apiVersion: v1
kind: Service
metadata:
  name: conhecerse
  namespace: dev
spec:
  selector:
    app: conhecerse
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conhecerse
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
  - host: conhecerse.lab
    http:
      paths:
      - path: /v1/webhooks
        pathType: Prefix
        backend:
          service:
            name: conhecerse-api
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: conhecerse
            port:
              number: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conhecerse-api
  namespace: dev
  labels:
    app: conhecerse-api
    part-of: conhecerse
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: conhecerse-api
  template:
    metadata:
      labels:
        app: conhecerse-api
        part-of: conhecerse
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: registry.platform.svc.cluster.local:5000/conhecerse-api:aguardando-primeiro-build
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        envFrom:
        - secretRef:
            name: conhecerse-app
        env:
        - name: WORKER_ENABLED
          value: 'false'
        volumeMounts:
        - name: bao-token
          mountPath: /var/run/secrets/openbao
          readOnly: true
      volumes:
      - name: bao-token
        secret:
          secretName: conhecerse-bao-token
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: conhecerse-api
  namespace: dev
spec:
  selector:
    app: conhecerse-api
  ports:
  - name: http
