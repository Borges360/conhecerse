# Prepared only; publish through gitops-publish.ps1. Total application memory limits: 4096 MiB,
# including the two OpenBao agent sidecars. Configure the OpenBao role conhecerse-dev before syncing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conhecerse
  namespace: dev
  labels:
    app: conhecerse
    part-of: conhecerse
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: conhecerse
  template:
    metadata:
      labels:
        app: conhecerse
        part-of: conhecerse
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: registry.platform.svc.cluster.local:5000/conhecerse:aguardando-primeiro-build
        ports:
        - name: http
          containerPort: 3000
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        startupProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
        envFrom:
        - secretRef:
            name: conhecerse-web
        env:
        - name: PORT
          value: '3000'
---
apiVersion: v1
kind: Service
metadata:
  name: conhecerse
  namespace: dev
spec:
  selector:
    app: conhecerse
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conhecerse
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
  - host: conhecerse.lab
    http:
      paths:
      - path: /v1/webhooks
        pathType: Prefix
        backend:
          service:
            name: conhecerse-api
            port:
              number: 8080
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: conhecerse-iam
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: conhecerse
            port:
              number: 3000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conhecerse-workload
  namespace: dev
  labels:
    part-of: conhecerse
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: conhecerse-bao-agent
  namespace: dev
  labels:
    part-of: conhecerse
data:
  agent.hcl: |
    exit_after_auth = false
    pid_file = "/tmp/bao-agent.pid"
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "conhecerse-dev"
          token_path = "/var/run/secrets/workload/token"
        }
      }
      sink "file" {
        config = {
          path = "/var/run/secrets/openbao/token"
          mode = 0600
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conhecerse-api
  namespace: dev
  labels:
    app: conhecerse-api
    part-of: conhecerse
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: conhecerse-api
  template:
    metadata:
      labels:
        app: conhecerse-api
        part-of: conhecerse
    spec:
      serviceAccountName: conhecerse-workload
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: bao-agent
        image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        restartPolicy: Always
        args:
        - agent
        - -config=/bao/config/agent.hcl
        env:
        - name: BAO_ADDR
          value: http://openbao.platform.svc.cluster.local:8200
        - name: SKIP_SETCAP
          value: 'true'
        - name: SKIP_CHOWN
          value: 'true'
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - test -s /var/run/secrets/openbao/token
          periodSeconds: 5
          failureThreshold: 60
        volumeMounts:
        - name: bao-token
          mountPath: /var/run/secrets/openbao
        - name: bao-config
          mountPath: /bao/config
          readOnly: true
        - name: workload-jwt
          mountPath: /var/run/secrets/workload
          readOnly: true
      containers:
      - name: app
        image: registry.platform.svc.cluster.local:5000/conhecerse-api:aguardando-primeiro-build
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
        envFrom:
        - secretRef:
            name: conhecerse-app
        env:
        - name: WORKER_ENABLED
          value: 'false'
        volumeMounts:
        - name: bao-token
          mountPath: /var/run/secrets/openbao
          readOnly: true
      volumes:
      - name: bao-token
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: bao-config
        configMap:
          name: conhecerse-bao-agent
      - name: workload-jwt
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: openbao
              expirationSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: conhecerse-api
  namespace: dev
spec:
  selector:
    app: conhecerse-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
