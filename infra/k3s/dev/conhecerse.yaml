apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-conhecerse
  namespace: dev
  labels:
    app.kubernetes.io/name: conhecerse
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conhecerse
        app.kubernetes.io/component: storage-init
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: registry.platform.svc.cluster.local:5000/minio-mc:latest
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
        envFrom:
        - secretRef:
            name: minio
        - secretRef:
            name: conhecerse-s3
        command: [sh, -ec]
        args:
        - |
          i=0
          until mc alias set local http://minio.dev.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
            i=$((i+1)); [ "$i" -lt 30 ] || exit 1; sleep 2
          done
          mc mb --ignore-existing local/conhecerse-private
          cat > /tmp/conhecerse-policy.json <<'POLICY'
          {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::conhecerse-private"]},
            {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::conhecerse-private/*"]}
          ]}
          POLICY
          if ! mc admin policy info local conhecerse-private-app >/dev/null 2>&1; then
            mc admin policy create local conhecerse-private-app /tmp/conhecerse-policy.json
          fi
          if ! mc admin user info local "$AWS_ACCESS_KEY_ID" >/dev/null 2>&1; then
            mc admin user add local "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
          fi
          mc admin policy attach local conhecerse-private-app --user "$AWS_ACCESS_KEY_ID"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: conhecerse-security-headers
  namespace: dev
spec:
  headers:
    customResponseHeaders:
      Cross-Origin-Embedder-Policy: require-corp
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
    permissionsPolicy: 'camera=(self), microphone=(self), geolocation=()'
