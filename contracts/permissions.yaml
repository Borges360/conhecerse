version: 1
status: normative
note: Role grants are necessary but not sufficient. Every policy also tests tenant/resource/state and matching patient assignments. No admin role can read clinical content alone.
roles:
  owner: [OWNER]
  admin: [ADMIN]
  clinical: [PSYCHOLOGIST]
  schedule_staff: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY]
  billing_staff: [OWNER, ADMIN, BILLING]
  content_staff: [OWNER, ADMIN]
policies:
  EMERGENCY_STAFF:
    requires_any: [OWNER, ADMIN, PSYCHOLOGIST]
    requires_all: [TENANT_ACTIVE, MFA_RECENT_15_MINUTES]
    restriction: REQUESTER_PLUS_DISTINCT_SECURITY_AND_ASSIGNED_CLINICAL_APPROVERS_SIGNED_NOTES_ONLY_MAX_15_MINUTES
  SUBJECT_OR_CLINICIAN:
    allowed_if_any: [PORTAL_LINKED_PATIENT, ASSIGNED_CLINICIAN, REVIEWED_GUARDIAN_EXPORT_RECIPIENT]
    restriction: NO_DIRECT_CLINICAL_OR_TEST_ACCESS_GRANTED_TO_SUBJECT
  CLINICIAN_OR_ADMIN:
    allowed_if_any: [OWNER, ADMIN, ASSIGNED_CLINICIAN]
    restriction: ADMIN_ONLY_WORKFLOW_METADATA
  LOGIN:
    any_authenticated_user: true
  USER_REGISTERED:
    any_authenticated_user: true
  MEMBER:
    tenant_membership_active: true
  OWNER_OR_ADMIN:
    requires_any: [OWNER, ADMIN]
    tenant_membership_active: true
  STAFF:
    requires_any: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY, BILLING]
    tenant_membership_active: true
  PATIENT_DIRECTORY:
    requires_any: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY]
    tenant_membership_active: true
    restriction: PSYCHOLOGIST_MUST_SEE_OWN_ASSIGNED_ONLY
  PATIENT_WRITE:
    requires_any: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY]
    restriction: CLINICIAN_ONLY_IF_ASSIGNED_OR_NEW_PATIENT_ENROLLMENT
  PATIENT_READ_SCOPED:
    allowed_if_any: [STAFF_AND_ALLOWED_CADASTRAL_SCOPE, PATIENT_PORTAL_LINKED, VERIFIED_GUARDIAN_ALLOWED]
  PATIENT_WRITE_SCOPED:
    allowed_if_any: [ADMIN_OR_SECRETARY_ALLOWED, PSYCHOLOGIST_ASSIGNED, PORTAL_OWN_NON_LEGAL_FIELDS]
  ASSIGNMENT_MANAGE:
    requires_any: [OWNER, ADMIN]
    restriction: NEW_CLINICIAN_MUST_HAVE_VERIFIED_ACTIVE_CRP_AND_ACCEPTED_HANDOFF
  SUBJECT_OR_AUTHORIZED:
    allowed_if_any: [PORTAL_LINKED_PATIENT, VERIFIED_LEGAL_GUARDIAN_ALLOWED, DATA_PROTECTION_STAFF]
  PATIENT_OR_AUTHORIZED:
    allowed_if_any: [PORTAL_LINKED_PATIENT, VERIFIED_GUARDIAN_SCHEDULE_SCOPE]
  PATIENT_OR_STAFF:
    allowed_if_any: [PORTAL_LINKED_PATIENT, VERIFIED_GUARDIAN_SCHEDULE_SCOPE, SCHEDULE_STAFF]
  APPOINTMENT_READ_SCOPED:
    allowed_if_any: [STAFF_WITH_APPOINTMENT_SCOPE, PORTAL_LINKED_PATIENT, VERIFIED_GUARDIAN_SCHEDULE_SCOPE]
  APPOINTMENT_WRITE:
    requires_any: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY]
    restriction: CLINICIAN_ONLY_ASSIGNED_OR_NEW_PATIENT
  APPOINTMENT_COMMAND_SCOPED:
    command_auth:
      accept: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY]
      reject: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY]
      start: [PSYCHOLOGIST_ASSIGNED]
      complete: [PSYCHOLOGIST_ASSIGNED]
      no-show: [PSYCHOLOGIST_ASSIGNED]
      cancel: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY, PATIENT_WITHIN_POLICY, GUARDIAN_SCHEDULE_SCOPE]
      reschedule-accept: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY]
      reschedule-decline: [OWNER, ADMIN, PSYCHOLOGIST, SECRETARY]
  VIDEO_PARTICIPANT:
    allowed_if_any: [PSYCHOLOGIST_ASSIGNED_AND_SCHEDULE_WINDOW, PATIENT_PORTAL_LINKED_AND_SCHEDULE_WINDOW, AUTHORIZED_GUARDIAN_IN_SESSION_AND_SCHEDULE_WINDOW]
  CLINICIAN_ASSIGNED:
    requires_all: [PSYCHOLOGIST_ACTIVE, ACTIVE_CARE_ASSIGNMENT, MATCHING_TENANT]
  NOTE_AUTHOR:
    requires_all: [PSYCHOLOGIST_ACTIVE, ACTIVE_CARE_ASSIGNMENT, ORIGINAL_AUTHOR, NOTE_DRAFT]
  NOTE_AUTHOR_MFA:
    requires_all: [PSYCHOLOGIST_ACTIVE, ACTIVE_CARE_ASSIGNMENT, ORIGINAL_AUTHOR, MFA_RECENT_15_MINUTES, NOTE_DRAFT]
  FILE_WRITE_SCOPED:
    allowed_if_any: [ASSIGNED_CLINICIAN_FOR_SENSITIVE, CONTENT_STAFF_FOR_PUBLIC_MATERIAL]
  FILE_READ_SCOPED:
    allowed_if_any: [ASSIGNED_CLINICIAN_FOR_SENSITIVE, PORTAL_PATIENT_WITH_PUBLISHED_DOC, STAFF_FOR_NON_SENSITIVE_MATERIAL]
  DOCUMENT_READ_SCOPED:
    allowed_if_any: [ASSIGNED_CLINICIAN, PORTAL_PATIENT_WITH_PUBLISHED_DOC, VERIFIED_GUARDIAN_LEGAL_REVIEW]
  DOCUMENT_AUTHOR:
    requires_all: [PSYCHOLOGIST_ACTIVE, ACTIVE_CARE_ASSIGNMENT, ORIGINAL_DOCUMENT_AUTHOR]
  BILLING_WRITE:
    requires_any: [OWNER, ADMIN, BILLING]
    restriction: SECRETARY_ONLY_WITH_EXPLICIT_FINANCIAL_DELEGATION
  BILLING_PRIVILEGED:
    requires_any: [OWNER, ADMIN, BILLING]
    restriction: AUDIT_REASON_REQUIRED
  BILLING_READ:
    requires_any: [OWNER, ADMIN, BILLING]
  BILLING_READ_SCOPED:
    allowed_if_any: [BILLING_READ, PATIENT_LINKED_TO_PAYER]
  BILLING_WRITE_OR_PAYER:
    allowed_if_any: [BILLING_WRITE, AUTHENTICATED_VERIFIED_PAYER]
  BILLING_OR_CLINICIAN:
    allowed_if_any: [BILLING_READ, PSYCHOLOGIST_OWN_ISSUANCE]
  CLINICIAN_OR_FISCAL:
    allowed_if_any: [PSYCHOLOGIST_ISSUER, OWNER_OR_ADMIN_WITH_FISCAL_DELEGATION_AND_NO_CLINICAL_ACCESS]
  CONTENT_READ_SCOPED:
    allowed_if_any: [STAFF, PORTAL_PATIENT_WITH_SHARE, PUBLIC_CONTENT]
  CONTENT_WRITE:
    requires_any: [OWNER, ADMIN]
  CONTENT_PUBLISH:
    requires_any: [OWNER, ADMIN]
    restriction: APPROVED_CONTENT_NOT_CONTAINING_PII
  CONTENT_SHARE:
    allowed_if_any: [OWNER, ADMIN, PSYCHOLOGIST_ASSIGNED]
  REPORT_READ:
    requires_any: [OWNER, ADMIN, SECRETARY, BILLING]
    restriction: NO_CLINICAL_TEXT
  REPORT_MANAGE:
    requires_any: [OWNER, ADMIN]
  PATIENT_LINKED:
    requires_all: [AUTHENTICATED_USER_LINKED_BY_PORTAL_USER_ID, PATIENT_RECORD_TENANT_MATCH]
  PAYER_LINKED:
    requires_all: [AUTHENTICATED_USER_VERIFIED_PAYER_OR_DOCUMENTED_GUARDIAN, INVOICE_TENANT_MATCH]
  PUBLIC:
    anonymous_allowed: true
    restrictions: [ONLY_PUBLIC_OPTED_IN_CONTENT, RATE_LIMIT, NO_HEALTH_PROFILING]
  WEBHOOK_SECRET:
    restrictions: [VALID_EXTERNAL_CONNECTION, AUTHENTICATED_PROVIDER_HEADER, DUPLICATE_PROTECTION]
