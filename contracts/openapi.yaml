components:
  securitySchemes:
    BffSession:
      type: apiKey
      in: cookie
      name: __Host-psico-session
      description: Cookie de sessão BFF; frontend não armazena bearer em localStorage.
    AsaasWebhookSecret:
      type: apiKey
      in: header
      name: asaas-access-token
      description: Exemplo de chave; confirmar header/token no contrato oficial Asaas antes do deploy.
  responses:
    Problem:
      description: Erro padronizado RFC 9457
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
      required:
      - type
      - title
      - status
      - code
      - requestId
    Ok:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        version:
          type: integer
      required:
      - id
      - version
    Page:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            type: object
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
    OrganizationCreate:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]{3,40}$
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        legalPersonType:
          type: string
          enum:
          - PF
          - PJ
        timezone:
          type: string
          default: America/Sao_Paulo
        ownerIsPsychologist:
          type: boolean
          default: false
        registration:
          $ref: '#/components/schemas/Registration'
      required:
      - slug
      - displayName
      - legalPersonType
    OrganizationPatch:
      type: object
      additionalProperties: false
      properties:
        displayName: &id006
          type: string
          maxLength: 500
        timezone:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        registration:
          $ref: '#/components/schemas/Registration'
    Organization:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        displayName:
          type: string
        timezone:
          type: string
        status:
          type: string
        settingsVersion:
          type: integer
        version:
          type: integer
        roles:
          type: array
          items:
            type: string
        registration:
          $ref: '#/components/schemas/Registration'
      required:
      - id
      - displayName
      - timezone
      - status
    MemberInvite:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - OWNER
            - ADMIN
            - PSYCHOLOGIST
            - SECRETARY
            - BILLING
      required:
      - email
      - roles
    ProfessionalCreate:
      type: object
      additionalProperties: false
      properties:
        userId: *id001
        crpUf:
          type: string
          pattern: ^[A-Z]{2}$
        crpNumber:
          type: string
          minLength: 2
          maxLength: 25
        displayName: *id006
        publicProfileEnabled: &id007
          type: boolean
        languages: &id008
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
          maxItems: 20
          uniqueItems: true
        specialties: &id009
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 120
          maxItems: 20
          uniqueItems: true
        appointmentTypes: &id010
          type: array
          items:
            type: string
            enum:
            - REMOTE
            - IN_PERSON
          maxItems: 2
          uniqueItems: true
        publicBio: &id011
          type: string
          minLength: 0
          maxLength: 2000
      required:
      - userId
      - crpUf
      - crpNumber
      - displayName
    Professional:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        displayName:
          type: string
        crpUf:
          type: string
        crpNumber:
          type: string
        verificationStatus:
          type: string
          enum:
          - PENDING
          - VERIFIED
          - REJECTED
          - SUSPENDED
        publicProfileEnabled: *id007
        version:
          type: integer
        languages: *id008
        specialties: *id009
        appointmentTypes: *id010
        publicBio: *id011
        reviewedSpecialties:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 120
          maxItems: 20
          uniqueItems: true
      required:
      - id
      - displayName
      - crpUf
      - crpNumber
      - verificationStatus
    PatientCreate:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 200
        socialName:
          type: string
          maxLength: 200
        cpf:
          type: string
          pattern: ^[0-9]{11}$
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        birthDate: *id005
        communicationPreference:
          type: string
          enum:
          - EMAIL
          - WHATSAPP
          - NONE
        professionalId: *id001
        address:
          anyOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
        emergencyContact:
          anyOf:
          - $ref: '#/components/schemas/EmergencyContact'
          - type: 'null'
      required:
      - fullName
    PatientPatch:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
        socialName:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        phone:
          type: string
        communicationPreference:
          type: string
          enum:
          - EMAIL
          - WHATSAPP
          - NONE
        address:
          anyOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
        emergencyContact:
          anyOf:
          - $ref: '#/components/schemas/EmergencyContact'
          - type: 'null'
        birthDate:
          type:
          - string
          - 'null'
          format: date
    Patient:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        displayName:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - DECEASED
        birthDate: *id005
        assignedProfessionals:
          type: array
          items: *id001
        version:
          type: integer
        fullName:
          type: string
        socialName:
          type: string
        email:
          type: string
        phone:
          type: string
        communicationPreference:
          type: string
        address:
          anyOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
        emergencyContact:
          anyOf:
          - $ref: '#/components/schemas/EmergencyContact'
          - type: 'null'
      required:
      - id
      - displayName
      - status
    PatientInvite:
      type: object
      additionalProperties: false
      properties:
        channel:
          type: string
          enum:
          - EMAIL
          - WHATSAPP
      required:
      - channel
    CareAssignmentCreate:
      type: object
      additionalProperties: false
      properties:
        professionalId: *id001
        startAt: &id012
          type: string
          format: date-time
        handoffEvidence:
          type: string
          minLength: 8
          maxLength: 2000
      required:
      - professionalId
    CareAssignment:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        professionalId: *id001
        patientId: *id001
        startAt: *id012
        endAt: *id012
      required:
      - id
      - professionalId
      - patientId
      - startAt
    AppointmentCreate:
      type: object
      additionalProperties: false
      properties:
        patientId: *id001
        professionalId: *id001
        startAt: *id012
        endAt: *id012
        modality:
          type: string
          enum:
          - REMOTE
          - IN_PERSON
        priceCents: &id013
          type: integer
          format: int64
          minimum: 0
          maximum: 2000000
        reasonCode:
          type: string
          maxLength: 60
      required:
      - patientId
      - professionalId
      - startAt
      - endAt
      - modality
    Appointment:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        patientId: *id001
        professionalId: *id001
        startAt: *id012
        endAt: *id012
        status:
          type: string
          enum:
          - REQUESTED
          - SCHEDULED
          - CONFIRMED
          - IN_PROGRESS
          - COMPLETED
          - NO_SHOW
          - CANCELLED
        version:
          type: integer
        modality:
          type: string
          enum:
          - REMOTE
          - IN_PERSON
        rescheduledFromId: *id001
        priceCents: *id013
      required:
      - id
      - patientId
      - professionalId
      - startAt
      - endAt
      - status
      - version
      - modality
    AppointmentTransition:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          minLength: 2
          maxLength: 60
        note:
          type: string
          maxLength: 500
      required:
      - reasonCode
    RecurrenceCreate:
      type: object
      additionalProperties: false
      properties:
        patientId: *id001
        professionalId: *id001
        rrule:
          type: string
          maxLength: 200
        localStartTime:
