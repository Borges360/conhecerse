app:
  environment: production
  locale: pt-BR
  defaultTimezone: America/Sao_Paulo
  publicBaseUrl: https://app.example.invalid
  apiBaseUrl: https://api.example.invalid
  allowAutoGeneratedClinicalContent: false
  clinicalRecordingEnabled: false
  clinicalTranscriptionEnabled: false
  database:
    schema: app
    rlsRequired: true
    forceRlsRequired: true
    hikariMaxPoolSize: 20
    transactionTimeoutSeconds: 15
  auth:
    oidcIssuerUrl: https://auth.example.invalid/realms/psico
    cookieName: __Host-psico-session
    cookieSecure: true
    cookieHttpOnly: true
    cookieSameSite: Lax
    staffMfaRequired: true
    clinicalSignatureMfaRecencyMinutes: 15
    maxFailedLoginAttempts: 5
    rateLimitWindowMinutes: 15
  scheduling:
    minDurationMinutes: 30
    maxDurationMinutes: 180
    offeredSlotIntervalMinutes: 15
    maxRecurrenceOccurrences: 52
    recurrenceHorizonDays: 90
    recurringExtensionTimeLocal: '02:00'
    patientVideoJoinBeforeMinutes: 10
    clinicianVideoJoinBeforeMinutes: 15
    roomJoinAfterEndMinutes: 30
    confirmationTokenHours: 72
    confirmationCutoffBeforeStartHours: 2
    cancelChargePercentDefault: 0
    cancelNoticeHoursDefault: 24
  video:
    provider: LIVEKIT_SELF_HOSTED
    signalingUrl: wss://meet.example.invalid
    nodeCountMin: 2
    redisCoordinationRequired: true
    turnTlsRequired: true
    tlsRequired: true
    e2eeRequired: true
    accessTokenTtlSeconds: 120
    egressEnabled: false
    recordingEnabled: false
  files:
    maxUploadBytes: 26214400
    allowedMimeTypes: [application/pdf, image/png, image/jpeg]
    signedDownloadUrlTtlSeconds: 60
    malwareScanRequired: true
    publicBucketAllowedForClinical: false
  jobs:
    maxInternalAttempts: 10
    maxExternalAttempts: 5
    leaseSeconds: 120
    batchSize: 100
  finance:
    currency: BRL
    provider: ASAAS
    checkoutHosted: true
    cardDataStored: false
    reconciliationIntervalHours: 6
    receiptEmissionMode: ASSISTED_EXTERNAL_ONLY
    allowGovBrCredentials: false
  notifications:
    transactionalEmailEnabled: true
    whatsappOfficialOnly: true
    requireMarketingOptIn: true
    dailyReportLocalTime: '07:00'
    dailyReportMaxDelayMinutes: 15
  dataProtection:
    clinicalNarrativeEncryptionRequired: true
    restrictTestMaterials: true
    logRetentionDays: 30
    clinicalRetentionYearsProvisional: 20
    legalHoldEnforced: true
  slos:
    availabilityPercent: 99.9
    readP95Milliseconds: 400
    writeP95Milliseconds: 700
    rpoMinutes: 15
    rtoHours: 4
secrets:
  backend: OPENBAO_KV_V2
  referenceOnly: true
  requiredKeys:
    - psico/prod/postgres
    - psico/prod/oidc
    - psico/prod/asaas
    - psico/prod/livekit
    - psico/prod/email
    - psico/prod/whatsapp
    - psico/prod/tenant-encryption
# Nunca preencher segredos no YAML versionado. Valores específicos de terceiros são provisionados por ambiente.
