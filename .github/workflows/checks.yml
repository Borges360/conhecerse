name: Engineering checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: conhecerse-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-unit-and-build:
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24.21.0'}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: '10.28.2'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13'}
      - run: pip install PyYAML==6.0.3
      - run: python scripts/generate_contracts.py --check
      - run: python scripts/generate_events.py --check
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: chmod +x backend/mvnw && cd backend && ./mvnw -B -Dtest=DomainTest,CriticalDomainTest,EventVersionTest,SignatureAndCallbackTest test

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with: {scan-type: fs, severity: 'CRITICAL,HIGH', exit-code: '1', scanners: 'vuln'}
