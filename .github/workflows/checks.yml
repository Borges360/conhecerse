name: Engineering checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24.21.0'}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: {version: '10.28.2'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13'}
      - run: pip install PyYAML==6.0.3
      - run: python scripts/generate_contracts.py --check
      - run: python scripts/generate_events.py --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test && pnpm build
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: {PLAYWRIGHT_CHANNEL: chromium}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: web-evidence, path: 'apps/web/test-results/'}
  java-and-postgresql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: synthetic_ci_only}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: chmod +x backend/mvnw && cd backend && ./mvnw -B -Prelease-gates verify
        env: {TEST_PG_ADMIN_URL: 'jdbc:postgresql://127.0.0.1:5432/postgres', TEST_PG_ADMIN_USER: postgres, TEST_PG_ADMIN_PASSWORD: synthetic_ci_only}
      - run: python3 scripts/check-critical-quality.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-evidence
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
            backend/target/pit-reports/
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with: {scan-type: fs, severity: 'CRITICAL,HIGH', exit-code: '1', scanners: 'vuln,secret'}
